name: tnt_tamil_calendar
description: TNT Tamil Calendar, Panchangam, Muhurtham & Notification Platform.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  supabase_flutter: ^2.5.0
  intl: ^0.20.3
  share_plus: ^13.3.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  http: any
  geolocator: ^14.1.1
  permission_handler: ^13.0.2
  geocoding: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
